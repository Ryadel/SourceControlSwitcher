name: Release

# Push a tag vX.Y.Z to release: the workflow checks the versions, builds, tests, publishes the VSIX to the
# Visual Studio Marketplace and creates the GitHub release. Run it manually for a dry run (no publishing).

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      SNK_BASE64: ${{ secrets.SNK_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      - uses: microsoft/setup-msbuild@v3

      - name: Check version
        id: version
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content 'SourceControlSwitcher/Manifest/source.extension.vsixmanifest'
          $version = $manifest.PackageManifest.Metadata.Identity.Version
          $assembly = (Select-String -Path 'SourceControlSwitcher/Properties/AssemblyInfo.cs' -Pattern 'AssemblyVersion\("([^"]+)"\)').Matches[0].Groups[1].Value
          $registration = (Select-String -Path 'SourceControlSwitcher/SourceControlSwitcherPackage.cs' -Pattern 'InstalledProductRegistration\("#110", "#112", "([^"]+)"\)').Matches[0].Groups[1].Value
          Write-Host "Manifest: $version  AssemblyVersion: $assembly  InstalledProductRegistration: $registration"
          if ($assembly -ne "$version.0") { throw "AssemblyVersion $assembly does not match manifest version $version" }
          if ($registration -ne $version) { throw "InstalledProductRegistration $registration does not match manifest version $version" }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw "Tag $env:GITHUB_REF_NAME does not match manifest version v$version" }
          if (-not (Select-String -Path 'CHANGELOG.txt' -SimpleMatch "SourceControlSwitcher - v$version" -Quiet)) { throw "CHANGELOG.txt has no section for v$version" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore strong-name key
        if: env.SNK_BASE64 != ''
        shell: pwsh
        run: '[IO.File]::WriteAllBytes("$PWD/Key.snk", [Convert]::FromBase64String($env:SNK_BASE64))'

      - name: Build
        run: msbuild SourceControlSwitcher.slnx -restore -p:Configuration=Release -p:DeployExtension=false -v:minimal

      - name: Test
        run: dotnet test SourceControlSwitcher.Tests/SourceControlSwitcher.Tests.csproj -c Release --no-build

      - name: Release notes from CHANGELOG
        shell: pwsh
        run: |
          $lines = Get-Content 'CHANGELOG.txt'
          $start = [Array]::FindIndex($lines, [Predicate[string]]{ param($l) $l -eq "SourceControlSwitcher - v${{ steps.version.outputs.version }}" })
          $end = [Array]::FindIndex($lines, $start + 1, [Predicate[string]]{ param($l) $l -like 'SourceControlSwitcher - v*' })
          if ($end -lt 0) { $end = $lines.Length }
          $lines[($start + 2)..($end - 1)] | Set-Content -Encoding utf8 'release-notes.md'
          Get-Content 'release-notes.md'

      - name: Upload VSIX and release notes
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            target/Release/SourceControlSwitcher.vsix
            release-notes.md
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    environment: marketplace
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: microsoft/setup-msbuild@v3

      - name: Download VSIX and release notes
        uses: actions/download-artifact@v7
        with:
          name: release
          path: release

      - name: Publish to the Visual Studio Marketplace
        shell: pwsh
        env:
          VS_MARKETPLACE_PAT: ${{ secrets.VS_MARKETPLACE_PAT }}
        run: |
          if (-not $env:VS_MARKETPLACE_PAT) { throw 'Secret VS_MARKETPLACE_PAT is not set' }
          # VsixPublisher ships with the Microsoft.VSSDK.BuildTools package: restore it.
          msbuild SourceControlSwitcher/SourceControlSwitcher.csproj -t:Restore -v:minimal
          $publisher = Get-ChildItem "$env:USERPROFILE\.nuget\packages\microsoft.vssdk.buildtools" -Recurse -Filter VsixPublisher.exe |
            Where-Object { $_.Directory.Name -eq 'bin' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $publisher) { throw 'VsixPublisher.exe not found' }
          & $publisher.FullName publish `
            -payload 'release/target/Release/SourceControlSwitcher.vsix' `
            -publishManifest 'SourceControlSwitcher/Manifest/publishManifest.json' `
            -personalAccessToken $env:VS_MARKETPLACE_PAT
          if ($LASTEXITCODE -ne 0) { throw "VsixPublisher failed with exit code $LASTEXITCODE" }

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $vsix = 'release/target/Release/SourceControlSwitcher.vsix'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $vsix --clobber
          } else {
            gh release create $tag $vsix --verify-tag `
              --title "Source Control Switcher ${{ needs.build.outputs.version }}" --notes-file 'release/release-notes.md'
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed with exit code $LASTEXITCODE" }
